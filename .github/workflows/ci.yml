name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Flake checks
        run: nix flake check --system "${{ matrix.system }}"
      - name: Build CLI and check version
        run: |
          nix build .#t3code
          HOME="$(mktemp -d)"
          export HOME
          test "$(./result/bin/t3 --version)" = "t3 v$(jq -r .version sources.json)"
          ./result/bin/t3 --help > /dev/null
      - name: Build desktop package
        run: nix build .#t3code-desktop --no-link
