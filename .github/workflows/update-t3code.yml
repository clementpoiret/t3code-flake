name: Update T3 Code

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-t3code
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      old: ${{ steps.update.outputs.old }}
      new: ${{ steps.update.outputs.new }}
      base_sha: ${{ steps.update.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Update release metadata
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old="$(jq -r .version sources.json)"
          nix develop --command ./scripts/update-t3code
          new="$(jq -r .version sources.json)"
          changed_files="$(git diff --name-only)"
          if [[ -n "$changed_files" && "$changed_files" != sources.json ]]; then
            printf 'updater changed unexpected files: %s\n' "$changed_files" >&2
            exit 1
          fi
          if [[ -z "$changed_files" ]]; then
            changed=false
          else
            changed=true
          fi
          git diff --exit-code -- flake.lock
          printf 'changed=%s\nold=%s\nnew=%s\nbase_sha=%s\n' "$changed" "$old" "$new" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.changed == 'true'
        with:
          name: t3code-sources
          path: sources.json
          retention-days: 1

  validate:
    needs: update
    if: needs.update.outputs.changed == 'true'
    name: Validate update (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3code-sources
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Check and build release
        run: |
          git diff --exit-code -- flake.lock
          nix flake check --system "${{ matrix.system }}"
          nix build .#t3code
          HOME="$(mktemp -d)"
          export HOME
          test "$(./result/bin/t3 --version)" = "t3 v$(jq -r .version sources.json)"
          ./result/bin/t3 --help > /dev/null
          nix build .#t3code-desktop --no-link

  publish:
    needs: [update, validate]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # Only the exact tree the native jobs validated may be published.
      - name: Confirm validated base
        env:
          BASE_SHA: ${{ needs.update.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$BASE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3code-sources
      - name: Commit and push to main
        env:
          OLD_VERSION: ${{ needs.update.outputs.old }}
          NEW_VERSION: ${{ needs.update.outputs.new }}
        run: |
          changed_files="$(git status --porcelain)"
          if [[ "$changed_files" != " M sources.json" ]]; then
            printf 'unexpected changes to publish:\n%s\n' "$changed_files" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore: update t3code to v$NEW_VERSION" \
            -m "Updates T3 Code from v$OLD_VERSION to v$NEW_VERSION.

          Upstream release: https://github.com/pingdotgg/t3code/releases/tag/v$NEW_VERSION

          The upstream SHA256SUMS entries for both CLI archives were verified before calculating Nix hashes.
          Validated natively on x86_64-linux and aarch64-linux: nix flake check, nix build .#t3code, t3 --version, t3 --help, and nix build .#t3code-desktop." \
            -- sources.json
          # Not forced: if main moved after the check above, this fails and the next run retries.
          git push origin HEAD:main
